<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>平泉の細道</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header><a href="{{ url_for('index') }}">平泉の細道</a><nav aria-label="アカウント">{% if current_user.is_authenticated %}<span>{{ current_user.username }} さん</span><form method="post" action="{{ url_for('logout_submit') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>ログアウト</button></form>{% else %}<a href="{{ url_for('register_form') }}">ユーザー登録</a><a href="{{ url_for('login_form') }}">ログイン</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/post_form.js') }}" defer></script></body></html>
